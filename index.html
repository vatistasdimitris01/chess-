
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grandmaster Chess Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #302e2b;
        color: #fff;
        margin: 0;
        overflow-x: hidden;
      }
      .chess-board-grid {
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
      }
      .square-light { background-color: #ebecd0; }
      .square-dark { background-color: #779556; }
      .square-highlight-move { background-color: rgba(0, 0, 0, 0.1); border-radius: 50%; width: 30%; height: 30%; }
      .square-highlight-capture { border: 4px solid rgba(0, 0, 0, 0.1); border-radius: 50%; width: 80%; height: 80%; }
      .square-last-move { background-color: rgba(255, 255, 0, 0.5); }
      .square-check { background: radial-gradient(circle, #ff0000 0%, rgba(255,0,0,0) 70%); }
      .square-premove { background-color: rgba(255, 0, 0, 0.3); }
      
      /* Hide scrollbar for move history but keep functionality */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "chess.js": "https://esm.sh/chess.js@^1.4.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
